<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>F25 model preview</title>
<style>html,body{margin:0;padding:0;background:#202833;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="label" style="position:fixed;top:8px;left:10px;color:#fff;font:13px monospace;z-index:9;text-shadow:0 0 3px #000"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const which = params.get('m') || 'armour';
const FILES = {
  armour: '/game/models/medieval_knight_armour.glb',
  sword:  '/game/models/medieval_sword.glb',
  bow:    '/game/models/medieval_bow_game_model.glb',
};
document.getElementById('label').textContent = which + ' — loading…';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(960, 640);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x39434f);
scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x2b2620, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const rim = new THREE.DirectionalLight(0x88aaff, 0.8); rim.position.set(-3, 2, -2); scene.add(rim);

// grid floor
const grid = new THREE.GridHelper(10, 20, 0x556677, 0x333d49);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(40, 960 / 640, 0.01, 100);

let model = null;
new GLTFLoader().load(FILES[which], (gltf) => {
  model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  document.getElementById('label').textContent =
    `${which}  size=(${size.x.toFixed(3)}, ${size.y.toFixed(3)}, ${size.z.toFixed(3)})  center=(${center.x.toFixed(2)},${center.y.toFixed(2)},${center.z.toFixed(2)})`;
  window.__previewReady = true;
}, undefined, (e) => {
  document.getElementById('label').textContent = which + ' — LOAD ERROR ' + e;
  window.__previewReady = true;
});

// fixed 4-angle orbit + a turntable; deterministic frames driven from JS
const angle = parseFloat(params.get('a') || '30');
const elev = parseFloat(params.get('e') || '10');
const dist = parseFloat(params.get('d') || '0');
function frame(t) {
  requestAnimationFrame(frame);
  if (!model) { renderer.render(scene, camera); return; }
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  const R = Math.max(sz.x, sz.y, sz.z);
  const d = dist > 0 ? dist : R * 2.6;
  const a = angle * Math.PI / 180, el = elev * Math.PI / 180;
  camera.position.set(
    c.x + d * Math.cos(el) * Math.sin(a),
    c.y + d * Math.sin(el),
    c.z + d * Math.cos(el) * Math.cos(a));
  camera.lookAt(c);
  renderer.render(scene, camera);
  window.__frame = (window.__frame || 0) + 1;
}
frame(0);
</script>
</body>
</html>
